name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Androidの土台を作る（lib と pubspec は上書きしない）
        run: flutter create --org com.example --project-name colab_video_app --platforms=android .
      - name: INTERNET権限を足す
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $f || sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' $f
          grep -q 'WRITE_EXTERNAL_STORAGE' $f || sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>/' $f
          grep -n permission $f
      - name: minSdkを上げる（media_store_plus用）
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f $f ]; then sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 33/' $f; grep -n minSdk $f; fi
          done
          true
      - run: flutter pub get
      - name: ビルド
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -n -A12 -E "What went wrong|Execution failed|error:|Error:" build.log | head -40 | tr '\n' '|' | sed 's/^/::error::/'
            echo
          fi
          tail -5 build.log
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: colab-video-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: ダウンロード用のリリースに載せる
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新のAPK
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
